AWSTemplateFormatVersion: '2010-09-09'
Description: Analytics storage buckets

Resources:
  # Raw analytics data. Large volumes with unpredictable, changing access
  # patterns over time. No lifecycle rules or tiering configured — all
  # objects stay in S3 Standard indefinitely.
  AnalyticsDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: arc319-analytics-raw-data
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
